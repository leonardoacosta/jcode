[package]
name = "jcode-intake-telegram"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
jcode-intake-types = { path = "../jcode-intake-types" }
jcode-provider-env = { path = "../jcode-provider-env" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
