[package]
name = "jcode-intake-slack"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
jcode-intake-types = { path = "../jcode-intake-types" }
jcode-provider-env = { path = "../jcode-provider-env" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "jcode-slack-intake"
path = "src/bin/jcode-slack-intake.rs"
