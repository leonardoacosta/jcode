[package]
name = "jcode-mac-browser-fleet"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jcode-mac-browser-policy = { path = "../jcode-mac-browser-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "io-util", "sync"] }
url = "2"

[dev-dependencies]
tempfile = "3"
