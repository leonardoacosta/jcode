[package]
name = "jcode-command-center"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "jcode_command_center"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
jcode-intake-types = { path = "../jcode-intake-types" }
jcode-task-types = { path = "../jcode-task-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
