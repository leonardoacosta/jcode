[package]
name = "jcode-command-center"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "jcode_command_center"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
jcode-task-types = { path = "../jcode-task-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
