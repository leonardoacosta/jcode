<!doctype html>
<!--
  repo-map renderer template — skills/repo-map/templates/renderer.html
  Adapted from foglamp-labs/foglamp's components/scan/{flow-map,left-rail,personality,brand}
  (Apache-2.0) + functioncall/blueprint's app.js/tokens.py (MIT) — see design.md D4/D5/D7 and
  docs/recon/foglamp-scan.md Card 3, docs/recon/functioncall-blueprint.md Cards 2/3/5.

  This file is a FROZEN template: scripts/bin/repo-map-render injects three double-brace
  placeholders (REPO_MAP_DATA, REPO_MAP_COORDINATES, REPO_MAP_FAVICONS — see the `var`
  assignments in the script block below for the exact token spelling) verbatim and never
  otherwise touches this file's markup — see references/renderer.md for the injection
  contract and maintenance notes. Never restate a token's literal double-brace form
  anywhere else in this file: render() replaces each on its FIRST string occurrence only,
  so a stray literal earlier in the document (e.g. in a comment) silently steals the slot.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>repo-map</title>
<style>
  :root {
    --rm-font-sans: Geist, "Geist Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    --rm-font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    /* Geist accent -> kind color mapping (references/renderer.md holds the maintenance table).
       Seven named slots (blue/teal/green/amber/red/orange/purple/pink) cover all 10 kinds:
       model=blue, tool=blue (folds alongside model), store=teal, entry/service=green,
       worker/queue=amber, agent=orange, external=purple, module=pink, red reserved for
       error/emphasis (unused as a kind color). */
    --rm-blue: #0070f3;
    --rm-teal: #12a594;
    --rm-green: #12b76a;
    --rm-amber: #f5a623;
    --rm-red: #ee0000;
    --rm-orange: #ff8a00;
    --rm-purple: #7c3aed;
    --rm-pink: #e5484d;

    --rm-bg: #fafafa;
    --rm-bg-canvas: #f3f3f3;
    --rm-surface: #ffffff;
    --rm-border: #e3e3e3;
    --rm-text: #171717;
    --rm-text-muted: #666666;
    --rm-accent: #0070f3;
    --rm-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.06);
    --rm-radius: 16px;
  }

  :root[data-theme="dark"] {
    --rm-bg: #0a0a0a;
    --rm-bg-canvas: #111111;
    --rm-surface: #171717;
    --rm-border: #2e2e2e;
    --rm-text: #ededed;
    --rm-text-muted: #a0a0a0;
    --rm-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --rm-bg: #0a0a0a;
      --rm-bg-canvas: #111111;
      --rm-surface: #171717;
      --rm-border: #2e2e2e;
      --rm-text: #ededed;
      --rm-text-muted: #a0a0a0;
      --rm-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--rm-font-sans);
    background: var(--rm-bg);
    color: var(--rm-text);
    overflow: hidden;
  }

  #rm-app {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "toolbar toolbar"
      "rail    canvas";
    height: 100vh;
    width: 100vw;
  }

  /* ---- Toolbar --------------------------------------------------------- */
  #rm-toolbar {
    grid-area: toolbar;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    border-bottom: 1px solid var(--rm-border);
    background: var(--rm-surface);
  }
  #rm-toolbar h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    font-family: var(--rm-font-mono);
    letter-spacing: -0.01em;
  }
  #rm-toolbar .rm-spacer { flex: 1; }
  #rm-toolbar select, #rm-toolbar button {
    font-family: var(--rm-font-sans);
    font-size: 13px;
    border: 1px solid var(--rm-border);
    background: var(--rm-bg-canvas);
    color: var(--rm-text);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  #rm-toolbar button:hover, #rm-toolbar select:hover { border-color: var(--rm-accent); }

  /* ---- Left rail --------------------------------------------------------- */
  #rm-rail {
    grid-area: rail;
    overflow-y: auto;
    border-right: 1px solid var(--rm-border);
    background: var(--rm-surface);
    padding: 16px 12px 32px;
    -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 24px), transparent 100%);
    mask-image: linear-gradient(to bottom, black calc(100% - 24px), transparent 100%);
  }
  .rm-rail-section { margin-bottom: 20px; }
  .rm-rail-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--rm-text-muted);
    margin: 0 0 8px 4px;
  }
  .rm-rail-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .rm-rail-item:hover { background: var(--rm-bg-canvas); }
  .rm-rail-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* ---- Personality card --------------------------------------------------- */
  #rm-personality {
    margin-top: 8px;
    border-radius: 14px;
    padding: 14px;
    color: #fff;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--rm-pcard-a, var(--rm-blue)), var(--rm-pcard-b, var(--rm-purple)));
  }
  #rm-personality::after {
    content: attr(data-glyph);
    position: absolute;
    right: -10px;
    bottom: -28px;
    font-size: 96px;
    font-weight: 700;
    opacity: .18;
    transform: rotate(-8deg);
    line-height: 1;
    font-family: var(--rm-font-mono);
  }
  #rm-personality .rm-p-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  #rm-personality .rm-p-desc { font-size: 11.5px; opacity: .9; }

  /* ---- Canvas / stage ----------------------------------------------------- */
  #rm-canvas {
    grid-area: canvas;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle, var(--rm-border) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--rm-bg-canvas);
    cursor: grab;
  }
  #rm-canvas.rm-dragging { cursor: grabbing; }
  #rm-stage {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #rm-edges {
    position: absolute;
    top: 0;
    left: 0;
    overflow: visible;
    pointer-events: none;
  }
  #rm-groups, #rm-nodes {
    position: absolute;
    top: 0;
    left: 0;
  }

  .rm-group-box {
    position: absolute;
    border: 1px dashed var(--rm-border);
    border-radius: 18px;
    background: color-mix(in srgb, var(--rm-surface) 55%, transparent);
  }
  .rm-group-label {
    position: absolute;
    top: -10px;
    left: 14px;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--rm-text-muted);
    background: var(--rm-bg-canvas);
    padding: 0 6px;
  }

  /* ---- Node cards ----------------------------------------------------- */
  .rm-node {
    position: absolute;
    background: var(--rm-surface);
    border: 1px solid var(--rm-border);
    border-radius: var(--rm-radius);
    box-shadow: var(--rm-shadow);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    transition: opacity .18s ease, filter .18s ease, transform .12s ease;
    animation: rm-enter .5s cubic-bezier(.2,.8,.2,1) both;
    animation-delay: var(--rm-delay, 0ms);
  }
  .rm-node:hover { transform: translateY(-1px); border-color: var(--rm-accent); }
  .rm-node.rm-dimmed { opacity: .22; filter: saturate(.4); }
  .rm-node.rm-lit { box-shadow: 0 0 0 2px var(--rm-kind-color, var(--rm-accent)), var(--rm-shadow); }

  .rm-node-head { display: flex; align-items: center; gap: 8px; }
  .rm-node-icon {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: var(--rm-kind-color, var(--rm-accent));
  }
  .rm-node-label { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
  .rm-node-sub { font-size: 10.5px; color: var(--rm-text-muted); margin-left: 30px; }
  .rm-node-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-left: 30px; margin-top: 2px; }
  .rm-chip {
    font-size: 9.5px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--rm-bg-canvas);
    border: 1px solid var(--rm-border);
    color: var(--rm-text-muted);
  }

  @keyframes rm-enter {
    from { opacity: 0; transform: translateY(6px) scale(.97); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* ---- Edges ------------------------------------------------------------ */
  .rm-edge-path { fill: none; stroke: var(--rm-border); stroke-width: 1.5; }
  .rm-edge-pulse {
    fill: none;
    stroke-width: 2;
    stroke-dasharray: 4 156;
    animation: rm-pulse 2.6s linear infinite;
    opacity: .9;
  }
  @keyframes rm-pulse { to { stroke-dashoffset: -160; } }
  .rm-edge-label-bg { fill: var(--rm-bg-canvas); }
  .rm-edge-label-text { font-family: var(--rm-font-mono); font-size: 9px; fill: var(--rm-text-muted); }
  .rm-edge.rm-dimmed .rm-edge-path,
  .rm-edge.rm-dimmed .rm-edge-pulse,
  .rm-edge.rm-dimmed .rm-edge-label-text { opacity: .12; }
  .rm-edge.rm-lit .rm-edge-path { stroke: var(--rm-accent); stroke-width: 2; }
  .rm-edge.rm-lit .rm-edge-pulse { opacity: 1; }

  /* ---- Detail popover (screen-space, outside the pan/zoom transform) --- */
  #rm-detail {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 300px;
    max-height: 60vh;
    overflow-y: auto;
    background: var(--rm-surface);
    border: 1px solid var(--rm-border);
    border-radius: 14px;
    box-shadow: var(--rm-shadow);
    padding: 14px;
    display: none;
    z-index: 20;
  }
  #rm-detail.rm-open { display: block; }
  #rm-detail .rm-detail-why { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  #rm-detail .rm-detail-row { font-size: 11.5px; margin: 4px 0; color: var(--rm-text-muted); }
  #rm-detail .rm-detail-row b { color: var(--rm-text); font-weight: 600; text-transform: uppercase; font-size: 9.5px; letter-spacing: .04em; display: block; }
  #rm-detail .rm-detail-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  #rm-detail .rm-detail-src { font-family: var(--rm-font-mono); font-size: 10px; color: var(--rm-text-muted); border-top: 1px solid var(--rm-border); padding-top: 8px; margin-top: 8px; }
  #rm-detail .rm-detail-close { position: absolute; top: 10px; right: 10px; cursor: pointer; border: none; background: none; color: var(--rm-text-muted); font-size: 14px; }

  /* ---- Reduced motion ---------------------------------------------------- */
  @media (prefers-reduced-motion: reduce) {
    .rm-node { animation: none !important; }
    .rm-edge-pulse { animation: none !important; opacity: .5; }
  }
</style>
</head>
<body>
<div id="rm-app">
  <div id="rm-toolbar">
    <h1 id="rm-title">repo-map</h1>
    <div class="rm-spacer"></div>
    <select id="rm-flow-picker" title="Light up a named flow">
      <option value="">No flow lens</option>
    </select>
    <button id="rm-zoom-reset" title="Reset pan/zoom">Reset view</button>
    <button id="rm-export" title="Export PNG">Export PNG</button>
    <button id="rm-theme-toggle" title="Toggle light/dark">Theme</button>
  </div>

  <div id="rm-rail">
    <div id="rm-personality"></div>
    <div class="rm-rail-section">
      <div class="rm-rail-title">Top models</div>
      <div id="rm-rail-models"></div>
    </div>
    <div class="rm-rail-section">
      <div class="rm-rail-title">Top tools</div>
      <div id="rm-rail-tools"></div>
    </div>
    <div class="rm-rail-section">
      <div class="rm-rail-title">Top integrations</div>
      <div id="rm-rail-integrations"></div>
    </div>
  </div>

  <div id="rm-canvas">
    <div id="rm-stage">
      <svg id="rm-edges"></svg>
      <div id="rm-groups"></div>
      <div id="rm-nodes"></div>
    </div>
  </div>
</div>

<div id="rm-detail">
  <button class="rm-detail-close" id="rm-detail-close" aria-label="Close">&times;</button>
  <div id="rm-detail-body"></div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // Injected data (repo-map-render's render() replaces these three tokens
  // verbatim — see references/renderer.md § Injection placeholder contract).
  // ---------------------------------------------------------------------
  var DATA = {"version":1,"nodes":[{"id":"n1","label":"CLI Entry","kind":"entry","group":"core","source_paths":["cmd/cli"]},{"id":"n2","label":"Core Service","kind":"service","group":"core","source_paths":["internal/service"]},{"id":"n3","label":"Local Store","kind":"store","source_paths":["internal/store"]}],"edges":[{"from":"n1","to":"n2","label":"invoke"},{"from":"n2","to":"n3","label":"read/write"}]};
  var COORDS = {"n1":{"x":24,"y":24,"width":180,"height":60,"group":"core"},"n2":{"x":24,"y":104,"width":180,"height":60,"group":"core"},"__group__core":{"x":12,"y":12,"width":192,"height":152},"n3":{"x":224,"y":58,"width":180,"height":60}};
  var FAVICONS = {};

  // ---------------------------------------------------------------------
  // Kind -> Geist accent color mapping (design.md D4; table in
  // references/renderer.md). model/tool fold to chips so they never render
  // as standalone nodes, but still need a color for their chip pills.
  // ---------------------------------------------------------------------
  var KIND_COLOR = {
    model: 'var(--rm-blue)',
    tool: 'var(--rm-blue)',
    store: 'var(--rm-teal)',
    entry: 'var(--rm-green)',
    service: 'var(--rm-green)',
    worker: 'var(--rm-amber)',
    queue: 'var(--rm-amber)',
    agent: 'var(--rm-orange)',
    external: 'var(--rm-purple)',
    module: 'var(--rm-pink)',
  };
  var KIND_GLYPH = {
    entry: 'EN', service: 'SV', worker: 'WK', agent: 'AG', model: 'ML',
    tool: 'TL', store: 'ST', queue: 'QU', external: 'EX', module: 'MD',
  };

  document.getElementById('rm-title').textContent =
    (window.location.pathname.split('/').pop() || 'repo-map').replace(/-map\.html$/, '');

  // ---------------------------------------------------------------------
  // fold(doc) — mirrors scripts/bin/repo-map-render's fold(): model/tool
  // nodes become chips on the node with an inbound edge; their edges are
  // dropped from the kept-edge set. Re-derived client-side because the
  // render script only serializes the ORIGINAL (unfolded) doc + the
  // computed layout coordinates, not the intermediate fold result.
  // ---------------------------------------------------------------------
  function fold(doc) {
    var foldableIds = {};
    (doc.nodes || []).forEach(function (n) {
      if (n.kind === 'model' || n.kind === 'tool') foldableIds[n.id] = true;
    });
    var chipsByParent = {};
    var keptEdges = [];
    (doc.edges || []).forEach(function (e) {
      if (foldableIds[e.to] && !foldableIds[e.from]) {
        var node = (doc.nodes || []).filter(function (n) { return n.id === e.to; })[0];
        (chipsByParent[e.from] = chipsByParent[e.from] || []).push(node);
        return;
      }
      keptEdges.push(e);
    });
    var keptNodes = (doc.nodes || []).filter(function (n) { return !foldableIds[n.id]; });
    return { nodes: keptNodes, edges: keptEdges, chipsByParent: chipsByParent };
  }

  var folded = fold(DATA);
  var nodeById = {};
  (DATA.nodes || []).forEach(function (n) { nodeById[n.id] = n; });
  var flowsById = {};
  (DATA.flows || []).forEach(function (f) { flowsById[f.id] = f; });

  // ---------------------------------------------------------------------
  // Personality card (design.md D5) — saturation-capped archetype scoring,
  // computed client-side from the kept node kinds (never trusts a possibly
  // stale doc.stats — deterministic pure function of DATA.nodes).
  // ---------------------------------------------------------------------
  function computeStats(nodes) {
    var s = { controlNodes: 0, intelligenceNodes: 0, dataNodes: 0, infraNodes: 0 };
    var CONTROL = { entry: 1, service: 1, worker: 1, agent: 1 };
    var INTEL = { model: 1, tool: 1 };
    var DATA_K = { store: 1, queue: 1 };
    var INFRA = { external: 1, module: 1 };
    nodes.forEach(function (n) {
      if (CONTROL[n.kind]) s.controlNodes += 1;
      else if (INTEL[n.kind]) s.intelligenceNodes += 1;
      else if (DATA_K[n.kind]) s.dataNodes += 1;
      else if (INFRA[n.kind]) s.infraNodes += 1;
    });
    return s;
  }

  function archetype(stats, total) {
    total = Math.max(total, 1);
    var cap = function (n, threshold) { return Math.min(n / threshold, 1); };
    var candidates = [
      { name: 'AI Orchestrator', glyph: 'AI', a: 'var(--rm-blue)', b: 'var(--rm-orange)',
        desc: 'Agents and models drive the architecture.',
        score: cap(stats.intelligenceNodes, total * 0.35) * 1.0 },
      { name: 'Data Fortress', glyph: 'DB', a: 'var(--rm-teal)', b: 'var(--rm-blue)',
        desc: 'Stores and queues anchor this repo.',
        score: cap(stats.dataNodes, total * 0.35) * 0.95 },
      { name: 'Service Mesh', glyph: 'SV', a: 'var(--rm-green)', b: 'var(--rm-teal)',
        desc: 'Many request-driven services collaborate here.',
        score: cap(stats.controlNodes, total * 0.5) * 0.9 },
      { name: 'Infra Backbone', glyph: 'IX', a: 'var(--rm-purple)', b: 'var(--rm-pink)',
        desc: 'External systems and IaC modules dominate.',
        score: cap(stats.infraNodes, total * 0.35) * 0.9 },
    ];
    candidates.sort(function (a, b) { return b.score - a.score; });
    var best = candidates[0];
    if (!best || best.score < 0.5) {
      return { name: 'Steady Builder', glyph: 'SB', a: 'var(--rm-blue)', b: 'var(--rm-purple)',
        desc: 'A balanced, no-drama architecture.' };
    }
    return best;
  }

  (function renderPersonality() {
    var stats = computeStats(folded.nodes.concat(
      Object.keys(folded.chipsByParent).reduce(function (acc, k) {
        return acc.concat(folded.chipsByParent[k]);
      }, [])
    ));
    var total = folded.nodes.length + Object.keys(folded.chipsByParent).reduce(
      function (n, k) { return n + folded.chipsByParent[k].length; }, 0
    );
    var arche = archetype(stats, total);
    var el = document.getElementById('rm-personality');
    el.style.setProperty('--rm-pcard-a', arche.a);
    el.style.setProperty('--rm-pcard-b', arche.b);
    el.setAttribute('data-glyph', arche.glyph);
    el.innerHTML =
      '<div class="rm-p-name">' + arche.name + '</div>' +
      '<div class="rm-p-desc">' + arche.desc + '</div>';
  })();

  // ---------------------------------------------------------------------
  // Left rail — draws rails.topModels/topTools/topIntegrations verbatim,
  // no re-derivation (contract.md § Rails).
  // ---------------------------------------------------------------------
  function renderRail(containerId, entries) {
    var el = document.getElementById(containerId);
    (entries || []).forEach(function (entry) {
      var row = document.createElement('div');
      row.className = 'rm-rail-item';
      var kind = nodeById[entry.id] ? nodeById[entry.id].kind : null;
      var color = kind ? KIND_COLOR[kind] : 'var(--rm-text-muted)';
      row.innerHTML = '<span class="rm-rail-dot" style="background:' + color + '"></span>' +
        '<span>' + escapeHtml(entry.label || entry.id) + '</span>';
      row.addEventListener('click', function () { focusNode(entry.id); });
      el.appendChild(row);
    });
  }
  var rails = DATA.rails || {};
  renderRail('rm-rail-models', rails.topModels);
  renderRail('rm-rail-tools', rails.topTools);
  renderRail('rm-rail-integrations', rails.topIntegrations);

  // ---------------------------------------------------------------------
  // Group boxes — from the __group__<id> coordinate entries repo-map-render
  // emits for every group encountered during layout.
  // ---------------------------------------------------------------------
  var groupsEl = document.getElementById('rm-groups');
  var GROUP_PAD = 22;
  Object.keys(COORDS).forEach(function (key) {
    if (key.indexOf('__group__') !== 0) return;
    var box = COORDS[key];
    var groupId = key.slice('__group__'.length);
    var div = document.createElement('div');
    div.className = 'rm-group-box';
    div.style.left = (box.x - GROUP_PAD) + 'px';
    div.style.top = (box.y - GROUP_PAD) + 'px';
    div.style.width = (box.width + GROUP_PAD * 2) + 'px';
    div.style.height = (box.height + GROUP_PAD * 2) + 'px';
    var label = document.createElement('div');
    label.className = 'rm-group-label';
    label.textContent = groupId;
    div.appendChild(label);
    groupsEl.appendChild(div);
  });

  // ---------------------------------------------------------------------
  // Node cards — entrance choreography delay proportional to x-position
  // ("draws itself along the flow", foglamp flow-map.tsx).
  // ---------------------------------------------------------------------
  var nodesEl = document.getElementById('rm-nodes');
  var maxX = 1;
  folded.nodes.forEach(function (n) {
    var c = COORDS[n.id];
    if (c) maxX = Math.max(maxX, c.x);
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var nodeEls = {};
  folded.nodes.forEach(function (n) {
    var c = COORDS[n.id];
    if (!c) return;
    var div = document.createElement('div');
    div.className = 'rm-node';
    div.dataset.id = n.id;
    div.style.left = c.x + 'px';
    div.style.top = c.y + 'px';
    div.style.width = c.width + 'px';
    div.style.setProperty('--rm-kind-color', KIND_COLOR[n.kind] || 'var(--rm-accent)');
    div.style.setProperty('--rm-delay', Math.round((c.x / maxX) * 350) + 'ms');

    var favicon = n.domain && FAVICONS[n.domain];
    var iconInner = favicon
      ? '<img src="' + favicon + '" width="14" height="14" style="border-radius:3px" alt="" />'
      : (KIND_GLYPH[n.kind] || '?');

    var chipsHtml = '';
    var chips = folded.chipsByParent[n.id] || [];
    if (chips.length) {
      chipsHtml = '<div class="rm-node-chips">' + chips.map(function (c2) {
        return '<span class="rm-chip">' + escapeHtml(c2.label) + '</span>';
      }).join('') + '</div>';
    }

    div.innerHTML =
      '<div class="rm-node-head">' +
        '<div class="rm-node-icon">' + iconInner + '</div>' +
        '<div class="rm-node-label">' + escapeHtml(n.label) + '</div>' +
      '</div>' +
      (n.sub ? '<div class="rm-node-sub">' + escapeHtml(n.sub) + '</div>' : '') +
      chipsHtml;

    div.addEventListener('click', function (ev) {
      ev.stopPropagation();
      traceDownstream(n.id);
      openDetail(n);
    });
    nodesEl.appendChild(div);
    nodeEls[n.id] = div;
  });

  // ---------------------------------------------------------------------
  // Edges — orthogonal rounded connectors + a duplicate CSS-only traveling
  // pulse path per edge (foglamp flow-map.tsx: strokeDasharray="4 156" +
  // keyframe strokeDashoffset animation, colored by source-kind hex —
  // one GPU animation per edge, zero per-edge JS loops).
  // ---------------------------------------------------------------------
  var svg = document.getElementById('rm-edges');
  var edgeEls = {};

  function elbowPath(sx, sy, tx, ty) {
    var midX = sx + (tx - sx) / 2;
    var r = 10;
    if (Math.abs(tx - sx) < r * 2) return 'M' + sx + ',' + sy + ' L' + tx + ',' + ty;
    var dir1 = tx > sx ? 1 : -1;
    var dir2 = ty > sy ? 1 : -1;
    return [
      'M', sx, sy,
      'L', midX - r * dir1, sy,
      'Q', midX, sy, midX, sy + r * dir2,
      'L', midX, ty - r * dir2,
      'Q', midX, ty, midX + r * dir1, ty,
      'L', tx, ty,
    ].join(' ');
  }

  function svgEl(tag, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  svg.appendChild(svgEl('defs')).innerHTML =
    '<marker id="rm-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">' +
    '<path d="M0,0 L8,4 L0,8 Z" fill="var(--rm-border)"/></marker>';

  folded.edges.forEach(function (e, i) {
    var s = COORDS[e.from];
    var t = COORDS[e.to];
    if (!s || !t) return;
    var sx = s.x + s.width;
    var sy = s.y + s.height / 2;
    var tx = t.x;
    var ty = t.y + t.height / 2;
    var d = elbowPath(sx, sy, tx, ty);
    var srcKind = nodeById[e.from] ? nodeById[e.from].kind : null;
    var color = KIND_COLOR[srcKind] || 'var(--rm-accent)';

    var g = svgEl('g', { class: 'rm-edge', 'data-from': e.from, 'data-to': e.to });
    var path = svgEl('path', { class: 'rm-edge-path', d: d, 'marker-end': 'url(#rm-arrow)' });
    var pulse = svgEl('path', { class: 'rm-edge-pulse', d: d, stroke: color });
    pulse.style.animationDelay = (i * 90) + 'ms';
    g.appendChild(path);
    g.appendChild(pulse);

    if (e.label) {
      var midX = (sx + tx) / 2;
      var midY = (sy + ty) / 2;
      var labelW = e.label.length * 5.6 + 10;
      g.appendChild(svgEl('rect', {
        class: 'rm-edge-label-bg', x: midX - labelW / 2, y: midY - 8, width: labelW, height: 14, rx: 7,
      }));
      var text = svgEl('text', {
        class: 'rm-edge-label-text', x: midX, y: midY + 3, 'text-anchor': 'middle',
      });
      text.textContent = e.label;
      g.appendChild(text);
    }

    svg.appendChild(g);
    edgeEls[e.from + '->' + e.to] = g;
  });

  // Size the SVG + stage to the content bounding box.
  (function sizeStage() {
    var maxRight = 0, maxBottom = 0;
    Object.keys(COORDS).forEach(function (k) {
      var c = COORDS[k];
      maxRight = Math.max(maxRight, c.x + c.width);
      maxBottom = Math.max(maxBottom, c.y + c.height);
    });
    svg.setAttribute('width', maxRight + 80);
    svg.setAttribute('height', maxBottom + 80);
  })();

  // ---------------------------------------------------------------------
  // Click-to-trace: downstream BFS from the clicked node dims everything
  // off-path (foglamp flow-map.tsx click handler).
  // ---------------------------------------------------------------------
  var adjacency = {};
  folded.edges.forEach(function (e) {
    (adjacency[e.from] = adjacency[e.from] || []).push(e.to);
  });

  function clearDim() {
    Object.keys(nodeEls).forEach(function (id) { nodeEls[id].classList.remove('rm-dimmed', 'rm-lit'); });
    Object.keys(edgeEls).forEach(function (id) { edgeEls[id].classList.remove('rm-dimmed', 'rm-lit'); });
  }

  var activeTraceId = null;
  function traceDownstream(startId) {
    if (activeTraceId === startId) { activeTraceId = null; clearDim(); return; }
    activeTraceId = startId;
    var visited = {};
    var queue = [startId];
    visited[startId] = true;
    while (queue.length) {
      var cur = queue.shift();
      (adjacency[cur] || []).forEach(function (next) {
        if (!visited[next]) { visited[next] = true; queue.push(next); }
      });
    }
    Object.keys(nodeEls).forEach(function (id) {
      nodeEls[id].classList.toggle('rm-dimmed', !visited[id]);
    });
    Object.keys(edgeEls).forEach(function (key) {
      var from = key.split('->')[0];
      edgeEls[key].classList.toggle('rm-dimmed', !visited[from]);
    });
  }

  document.getElementById('rm-canvas').addEventListener('click', function () {
    activeTraceId = null;
    clearDim();
    closeDetail();
  });

  function focusNode(id) {
    var c = COORDS[id];
    if (!c) return;
    traceDownstream(id);
  }

  // ---------------------------------------------------------------------
  // Detail popover (blueprint C2: tiered card — WHY headline -> prose ->
  // fact chips -> src footer). Rendered outside the pan/zoom transform
  // (screen-space, stays crisp — foglamp's documented reason).
  // ---------------------------------------------------------------------
  var DETAIL_PROSE_ORDER = ['effects', 'fails', 'sends', 'auth', 'ordering'];
  var DETAIL_PROSE_LABEL = {
    effects: 'Effects', fails: 'On fail', sends: 'Sends', auth: 'Auth', ordering: 'Ordering',
  };
  function openDetail(n) {
    var body = document.getElementById('rm-detail-body');
    var detail = n.detail || {};
    var html = '';
    html += '<div class="rm-detail-why">' + escapeHtml(detail.why || n.label) + '</div>';
    DETAIL_PROSE_ORDER.forEach(function (k) {
      if (!detail[k]) return;
      html += '<div class="rm-detail-row"><b>' + DETAIL_PROSE_LABEL[k] + '</b>' + escapeHtml(detail[k]) + '</div>';
    });
    html += '<div class="rm-detail-chips">' +
      '<span class="rm-chip">' + escapeHtml(n.kind) + '</span>' +
      (n.sub ? '<span class="rm-chip">' + escapeHtml(n.sub) + '</span>' : '') +
      (n.domain ? '<span class="rm-chip">' + escapeHtml(n.domain) + '</span>' : '') +
      '</div>';
    if (n.src) html += '<div class="rm-detail-src">' + escapeHtml(n.src) + '</div>';
    body.innerHTML = html;
    document.getElementById('rm-detail').classList.add('rm-open');
  }
  function closeDetail() { document.getElementById('rm-detail').classList.remove('rm-open'); }
  document.getElementById('rm-detail-close').addEventListener('click', closeDetail);

  // ---------------------------------------------------------------------
  // Named-flow picker (blueprint C3): select a flow, its tagged edges +
  // endpoint nodes light start-to-finish via .lit, everything else dims.
  // One lens at a time; j/k cycles through the registered flows.
  // ---------------------------------------------------------------------
  var flowPicker = document.getElementById('rm-flow-picker');
  (DATA.flows || []).forEach(function (f) {
    var opt = document.createElement('option');
    opt.value = f.id;
    opt.textContent = f.label;
    flowPicker.appendChild(opt);
  });

  function applyFlowLens(flowId) {
    clearDim();
    if (!flowId) return;
    var litNodeIds = {};
    Object.keys(edgeEls).forEach(function (key) {
      // key is "from->to"; find the matching edge in folded.edges for its flows[].
    });
    var edgeFlowMatch = {};
    folded.edges.forEach(function (e) {
      edgeFlowMatch[e.from + '->' + e.to] = (e.flows || []).indexOf(flowId) !== -1;
    });
    Object.keys(edgeEls).forEach(function (key) {
      var match = edgeFlowMatch[key];
      edgeEls[key].classList.toggle('rm-lit', !!match);
      edgeEls[key].classList.toggle('rm-dimmed', !match);
      if (match) {
        var parts = key.split('->');
        litNodeIds[parts[0]] = true;
        litNodeIds[parts[1]] = true;
      }
    });
    Object.keys(nodeEls).forEach(function (id) {
      nodeEls[id].classList.toggle('rm-lit', !!litNodeIds[id]);
      nodeEls[id].classList.toggle('rm-dimmed', !litNodeIds[id]);
    });
  }
  flowPicker.addEventListener('change', function () { applyFlowLens(flowPicker.value); });
  document.addEventListener('keydown', function (ev) {
    if (ev.target.tagName === 'SELECT' || ev.target.tagName === 'INPUT') return;
    if (ev.key !== 'j' && ev.key !== 'k') return;
    var opts = Array.prototype.slice.call(flowPicker.options);
    var idx = opts.findIndex(function (o) { return o.value === flowPicker.value; });
    idx = ev.key === 'j' ? Math.min(idx + 1, opts.length - 1) : Math.max(idx - 1, 0);
    flowPicker.value = opts[idx].value;
    applyFlowLens(flowPicker.value);
  });

  // ---------------------------------------------------------------------
  // Pan/zoom — imperative transform on #rm-stage, no re-render per
  // pointermove (foglamp flow-map.tsx). will-change dropped 150ms after
  // the gesture ends so text stays crisp at rest.
  // ---------------------------------------------------------------------
  var canvas = document.getElementById('rm-canvas');
  var stage = document.getElementById('rm-stage');
  var view = { x: 40, y: 40, scale: 1 };
  var dragging = false, lastX = 0, lastY = 0, wcTimer = null;

  function applyTransform() {
    stage.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.scale + ')';
  }
  applyTransform();

  canvas.addEventListener('pointerdown', function (ev) {
    dragging = true;
    lastX = ev.clientX; lastY = ev.clientY;
    canvas.classList.add('rm-dragging');
    stage.style.willChange = 'transform';
  });
  window.addEventListener('pointermove', function (ev) {
    if (!dragging) return;
    view.x += ev.clientX - lastX;
    view.y += ev.clientY - lastY;
    lastX = ev.clientX; lastY = ev.clientY;
    applyTransform();
  });
  window.addEventListener('pointerup', function () {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('rm-dragging');
    clearTimeout(wcTimer);
    wcTimer = setTimeout(function () { stage.style.willChange = 'auto'; }, 150);
  });
  canvas.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var delta = ev.deltaY > 0 ? 0.9 : 1.1;
    view.scale = Math.min(Math.max(view.scale * delta, 0.25), 2.5);
    applyTransform();
  }, { passive: false });

  document.getElementById('rm-zoom-reset').addEventListener('click', function () {
    view = { x: 40, y: 40, scale: 1 };
    applyTransform();
  });

  // ---------------------------------------------------------------------
  // Theme toggle — persists in localStorage; falls back to
  // prefers-color-scheme when unset (see the [data-theme] CSS overrides).
  // ---------------------------------------------------------------------
  var THEME_KEY = 'repo-map-theme';
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  applyTheme(localStorage.getItem(THEME_KEY));
  document.getElementById('rm-theme-toggle').addEventListener('click', function () {
    var current = document.documentElement.getAttribute('data-theme')
      || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });

  // ---------------------------------------------------------------------
  // PNG export (blueprint Card 5) — serialize the stage as an SVG
  // foreignObject, draw to a 2x canvas, download. Pure browser natives,
  // no library: base look survives via inline CSS custom properties
  // (already resolved values, since getComputedStyle isn't needed — the
  // stage's own stylesheet travels with the foreignObject).
  // ---------------------------------------------------------------------
  document.getElementById('rm-export').addEventListener('click', function () {
    var rect = stage.getBoundingClientRect();
    var w = Math.max(rect.width, 400);
    var h = Math.max(rect.height, 300);
    var scale = 2;
    var styleText = Array.prototype.slice.call(document.styleSheets).map(function (sheet) {
      try {
        return Array.prototype.slice.call(sheet.cssRules).map(function (r) { return r.cssText; }).join('\n');
      } catch (e) { return ''; }
    }).join('\n');
    var stageHtml = stage.outerHTML.replace(/transform:[^;"]*;?/, '');
    var svgMarkup =
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + (w * scale) + '" height="' + (h * scale) + '">' +
      '<foreignObject width="100%" height="100%">' +
      '<div xmlns="http://www.w3.org/1999/xhtml" style="transform:scale(' + scale + ');transform-origin:0 0;">' +
      '<style>' + styleText + '</style>' + stageHtml +
      '</div></foreignObject></svg>';
    var svgBlob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(svgBlob);
    var img = new Image();
    img.onload = function () {
      var canvasEl = document.createElement('canvas');
      canvasEl.width = w * scale;
      canvasEl.height = h * scale;
      var ctx = canvasEl.getContext('2d');
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--rm-bg') || '#fff';
      ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      var a = document.createElement('a');
      a.download = 'repo-map.png';
      a.href = canvasEl.toDataURL('image/png');
      a.click();
    };
    img.src = url;
  });
})();
</script>
</body>
</html>
