# Fallow CI step template for T3 fleet repos.
#
# Splice this `fallow` job into your existing `.github/workflows/ci.yml`.
# For Bun-based repositories, swap `pnpm` for `bun` in the run lines.
#
# Cache key includes baseline so a regenerated baseline invalidates the cache.

  fallow:
    name: Fallow regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for changed-since-base diff mode

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Cache fallow analysis
        uses: actions/cache@v4
        with:
          path: .fallow/cache.bin
          key: fallow-${{ hashFiles('**/package.json', '**/tsconfig*.json', '.fallowrc.json', '.fallow/baseline.json') }}
          restore-keys: |
            fallow-

      - name: Run fallow regression gate
        run: pnpm fallow:check || (echo "::error::Fallow detected regressions against baseline. Run 'pnpm fallow' locally for details." && exit 1)

# package.json wiring (add under "scripts"):
#   "fallow": "fallow --format pretty",
#   "fallow:check": "fallow --regression-baseline .fallow/baseline.json --fail-on-regression --format json --quiet 2>/dev/null || exit 1"
#
# NOTE (verified 2026-07-14 against installed fallow 2.88.3): a frozen baseline
# that already contains error-severity issues (the normal case on first
# adoption of an existing codebase) makes the raw process exit code 1 on EVERY
# run, not just on a real regression -- exit code alone is NOT a reliable
# pass/fail signal here. A CI gate MUST instead parse the JSON output and
# compare its total_issues count against the frozen baseline's total_issues,
# treating "count did not increase" as pass regardless of the raw exit code.
# Generate the baseline with `fallow --save-regression-baseline <path>` (NOT
# the old, nonexistent `fallow --check --baseline` combo this template used to
# document -- neither `--check` nor that `--baseline` usage exist in 2.88.3;
# confirmed live via `fallow --help` and `fallow config-schema`).
