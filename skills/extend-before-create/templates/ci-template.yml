# Canonical CI workflow template for T3 Turbo repos
# Portable starting point with lint, format, typecheck, test, build, and fallow jobs.
#
# Per-repo customizations: see skills/extend-before-create/templates/ci-install.md
# Substitution placeholders are wrapped in {{ DOUBLE_BRACES }}.

name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Vercel Remote Caching via Turbo. Both TURBO_TEAM (vars) and TURBO_TOKEN (secrets)
# must be configured at the repo level for cache hits. Without them, builds still
# succeed but lose the cache speedup.
# @link https://turborepo.com/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint && pnpm lint:ws

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      # {{REMOVE_IF_NO_INTEGRATION_TESTS}}
      # Vitest integration tests that hit a real DB need a postgres service here.
      # If the repo has no integration tests (only pure-unit vitest), drop this
      # services: block and the DATABASE_URL env below.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Test
        env:
          # {{REMOVE_IF_NO_INTEGRATION_TESTS}}
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/test
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Build
        run: pnpm turbo run build

  fallow:
    # Fleet anti-pattern A2: every CI MUST include a fallow audit gate to catch
    # dead code, duplication, circular dependencies, and boundary violations
    # before they ship. Soft-fail by default; flip to hard-fail once the baseline
    # is clean. See skills/fallow/ for the audit contract.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Fallow audit
        # Use `audit` for changed-files-only diff mode (fast); use `analyze` for
        # full-repo scan (slower; better for periodic deep checks via cron).
        run: pnpm fallow audit --no-fail-on-issues
        continue-on-error: true

  # {{ENABLE_E2E_IF_PLAYWRIGHT}}
  # Enable this job if the repo has packages/e2e/ with Playwright tests.
  # Delete the entire job block if e2e is out of scope for this repo.
  e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install Playwright browsers
        run: pnpm --filter @{{WORKSPACE}}/e2e exec playwright install --with-deps chromium

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: E2E
        env:
          # {{ADJUST_FOR_REAL_DB_E2E}}
          # If e2e tests hit a deployed preview, set BASE_URL secret.
          # If e2e tests run against local dev server, set PORT.
          PORT: 3000
        # Root test surface (t3-testing-patterns § Root Test Surface): invoke the
        # standardized root key, not a per-package filter.
        run: pnpm test:e2e
