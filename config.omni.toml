[server]
wake_mode = "internal"

[keybindings]
scroll_up = "ctrl+k"
scroll_down = "ctrl+j"
scroll_page_up = "alt+u"
scroll_page_down = "alt+d"
model_switch_next = "ctrl+tab"
model_switch_prev = "ctrl+shift+tab"
fallback_switch = "ctrl+y"
effort_increase = "cmd+right"
effort_decrease = "cmd+left"
centered_toggle = "alt+c"
scroll_prompt_up = "ctrl+["
scroll_prompt_down = "ctrl+]"
scroll_bookmark = "ctrl+g"
auto_poke_toggle = "ctrl+p"
scroll_up_fallback = ""
scroll_down_fallback = ""
workspace_left = "alt+h"
workspace_down = "alt+j"
workspace_up = "alt+k"
workspace_right = "alt+l"
side_panel_toggle = "alt+m"
copy_selection_toggle = "alt+y"
diagram_pane_toggle = "alt+t"
diagram_pane_visibility_toggle = "alt+shift+m"
typing_scroll_lock_toggle = "alt+s"
diff_mode_cycle = "alt+g"
info_widget_toggle = "alt+i"
todo_card_toggle = "alt+x"
swarm_panel_focus = "cmd+n"
new_terminal = "alt+shift+;"
open_resume = "alt+r"
voice_input = "ctrl+space"
session_picker_enter = "current-terminal"

[dictation]
command = ""
mode = "send"
key = "off"
timeout_secs = 90
vocabulary = []
recorder = ""

[display]
diff_mode = "inline"
queue_mode = false
auto_server_reload = true
mouse_capture = true
debug_socket = false
emoji = true
centered = false
show_thinking = true
reasoning_display = "full"
diagram_mode = "none"
markdown_spacing = "compact"
latex_rendering = "unicode"
pin_images = true
pin_todos = true
idle_animation = true
prompt_entry_animation = true
disabled_animations = []
performance = "full"
animation_fps = 60
redraw_fps = 60
prompt_preview = true
compact_notifications = true
copy_badge_alt_label = "⌥"
show_agentgrep_output = false
show_bash_output = false
tool_call_details = false
keybinding_hints = true
theme = ""
active_sessions_manager = true
external_sessions = false
usage_display = "left"

[display.native_scrollbars]
chat = true
side_panel = true

[display.colors]

[features]
check_updates = true
memory = true
swarm = true
mermaid = true
auto_poke = true
message_timestamps = true
persist_memory_injections = false
kv_cache_miss_notices = true
update_channel = "stable"

[websearch]
engine = "duckduckgo"
fallback_engines = ["bing"]
bing_api_key_env = "JCODE_BING_API_KEY"
bing_market = "en-US"
searxng_url_env = "JCODE_SEARXNG_URL"

[tools]
profile = "full"
enabled = []
disabled = []
disable_base_tools = false
mcp_tools = "auto"
mcp_tools_token_threshold = 8000

[acp]
profile = "full"
tool_profile = "acp"

[auth]
trusted_external_sources = []

[provider]
default_model = "gpt-6.1-sol"
default_provider = "omni"
openai_reasoning_effort = "low"
anthropic_cache_ttl_1h = true
openai_service_tier = "off"
openai_native_compaction_mode = "auto"
openai_native_compaction_threshold_tokens = 200000
preserve_reasoning_context = true
cross_provider_failover = "manual"
same_provider_account_failover = true
gemini_force_oauth = false
stream_idle_timeout_secs = 180
max_retries = 8
retry_backoff_cap_secs = 30

[providers.omni]
api = "responses"
type = "open-ai-compatible"
base_url = "https://omni.leonardoacosta.dev:443/v1"
auth = "bearer"
api_key_env = "JCODE_PROVIDER_OMNI_API_KEY"
env_file = "provider-omni.env"
default_model = "gpt-6.1-sol"
requires_api_key = true
provider_routing = false
model_catalog = false
allow_provider_pinning = false
supports_reasoning_effort = true
disable_reasoning_heuristics = false
extra_body = { service_tier = "priority" }

[[providers.omni.models]]
id = "gpt-6.1-sol"
input = ["text", "image"]

[[providers.omni.models]]
id = "gpt-6-astra"
input = ["text", "image"]

[[providers.omni.models]]
id = "gpt-6-luna"
input = ["text", "image"]

[[providers.omni.models]]
id = "gpt-6-sol"
input = ["text", "image"]

[agents]
swarm_model = "omni:gpt-6-luna"
swarm_effort = "high"
swarm_root_effort = "max"
swarm_deep_root_effort = "max"
swarm_spawn_mode = "inline"
swarm_strip_layout = "vertical"
memory_jev_provider = "auto"
memory_jev_threshold = 0.800000011920929
memory_sidecar_enabled = true
memory_model = "inherit"
memory_rerank_cadence = 3
memory_rerank_votes = 2
memory_rerank_min_agree = 2
memory_embedding_backend = "local"
swarm_max_concurrent_agents = 32

[terminal]
preferred = "ghostty"

[hooks]
pre_tool_transform_timeout_ms = 500
turn_start = "'/home/nyaptor/.local/bin/moshi-hook' jcode-hook"
turn_end = "'/home/nyaptor/.local/bin/moshi-hook' jcode-hook"
session_start = "'/home/nyaptor/.local/bin/moshi-hook' jcode-hook"
session_end = "'/home/nyaptor/.local/bin/moshi-hook' jcode-hook"
pre_tool_timeout_ms = 5000

[ambient]
enabled = false
allow_api_keys = false
min_interval_minutes = 5
max_interval_minutes = 120
pause_on_active_session = true
proactive_work = true
work_branch_prefix = "ambient/"
visible = true

[safety]
ntfy_topic = "jcode-ambient"
ntfy_server = "https://ntfy.leonardoacosta.dev"
desktop_notifications = true
email_enabled = false
email_smtp_port = 587
email_imap_port = 993
email_reply_enabled = false
telegram_enabled = false
telegram_reply_enabled = true
discord_enabled = false
discord_reply_enabled = false
jade_relay_enabled = false
jade_relay_reply_enabled = false
jade_relay_launch_enabled = false

[notifications]
turn_complete = true
turn_complete_min_secs = 120
turn_complete_todo_min_secs = 30
turn_complete_only_when_unfocused = true
turn_complete_sound = "Glass"

[gateway]
enabled = false
port = 7643
bind_addr = "0.0.0.0"

[compaction]
mode = "reactive"
lookahead_turns = 15
ewma_alpha = 0.30000001192092896
proactive_floor = 0.4000000059604645
min_samples = 3
stall_window = 5
min_turns_between_compactions = 10
topic_shift_threshold = 0.44999998807907104
relevance_keep_threshold = 0.6499999761581421
goal_window_turns = 5
max_context_tokens = 0

[power]
prevent_sleep_while_streaming = true
block_lid_close = true

[autoreview]
enabled = true
model = "omni:gpt-6.1-sol"

[autojudge]
enabled = true
model = "omni:gpt-6-luna"

[launch_hotkeys]
enabled = true
imported = true

[[launch_hotkeys.entries]]
chord = "cmd+;"
dir = "/home/nyaptor/.jcode"
label = ".jcode"
self_dev = false

[[launch_hotkeys.entries]]
chord = "cmd+'"
dir = "$HOME"
label = "home"
self_dev = false

[[launch_hotkeys.entries]]
chord = "cmd+["
dir = "/home/nyaptor/dev/personal/zeron-fork"
label = "zeron-fork"
self_dev = false

[[launch_hotkeys.entries]]
chord = "cmd+]"
dir = "/home/nyaptor/dev/personal/homelab"
label = "homelab"
self_dev = false

[[launch_hotkeys.entries]]
chord = 'cmd+\'
dir = "/home/nyaptor/dev/personal/mesh"
label = "mesh"
self_dev = false
