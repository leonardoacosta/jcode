<html lang="en">

  <title>sample-directional-infra isometric system map</title>
  <style>
    :root {
      --page-bg: #090b11;
      --text: #f2f4f8;
      --muted: #9ba6b7;
      --hairline: rgba(255,255,255,.18);
      --control-bg: rgba(9,11,17,.82);
      --control-hover: rgba(255,255,255,.09);
      --focus: #ffffff;
      --network-direct: #0078d4;
      --network-inferred: #886200;
      --network-held: #5933a3;
      --font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--page-bg);
      color: var(--text);
      font-family: var(--font-family);
    }
    button { font: inherit; }
    .map-shell { position: relative; width: 100%; height: 100%; min-height: 520px; isolation: isolate; }
    .canvas-stage { position: absolute; inset: 0; overflow: hidden; }
    .canvas-stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    canvas[data-layer="terrain"], canvas[data-layer="architecture"] { pointer-events: none; }
    canvas[data-layer="motion"] { touch-action: manipulation; }
    .scene-caption {
      position: absolute;
      z-index: 5;
      top: clamp(18px, 3vw, 42px);
      left: clamp(18px, 3vw, 46px);
      max-width: min(560px, calc(100vw - 220px));
      pointer-events: none;
      text-wrap: balance;
    }
    .eyebrow {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(18px, 2.1vw, 31px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }
    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: clamp(10px, 1vw, 13px);
      line-height: 1.55;
    }
    .scene-controls {
      position: absolute;
      z-index: 6;
      top: clamp(18px, 3vw, 42px);
      right: clamp(18px, 3vw, 46px);
      display: flex;
      gap: 8px;
    }
    .scene-controls button,
    .scene-controls select {
      min-width: 42px;
      min-height: 40px;
      padding: 9px 12px;
      border: 1px solid var(--hairline);
      border-radius: 3px;
      background: var(--control-bg);
      color: var(--text);
      cursor: pointer;
    }
    .scene-controls select { max-width: min(260px, 36vw); }
    .scene-controls button:hover,
    .scene-controls select:hover { background: var(--control-hover); }
    .scene-controls button:focus-visible,
    .scene-controls select:focus-visible,
    .legend button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }
    .legend {
      position: absolute;
      z-index: 5;
      left: clamp(18px, 3vw, 46px);
      bottom: clamp(16px, 2.7vw, 38px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px 13px;
      max-width: calc(100vw - 92px);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .04em;
    }
    .legend button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 3px 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    .legend-swatch { width: 24px; height: 8px; display: inline-block; }
    .tooltip {
      position: fixed;
      z-index: 9;
      max-width: min(360px, calc(100vw - 32px));
      padding: 10px 12px;
      border: 1px solid var(--hairline);
      border-radius: 3px;
      background: var(--control-bg);
      color: var(--text);
      box-shadow: 0 12px 40px rgba(0,0,0,.24);
      font-size: 11px;
      line-height: 1.45;
      pointer-events: none;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 100ms linear, transform 100ms linear;
    }
    .tooltip[data-visible="true"] { opacity: 1; transform: translateY(0); }
    .tooltip strong { display: block; margin-bottom: 4px; font-size: 12px; }
    .tooltip span { display: block; color: var(--muted); }
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    .views-shell {
      position: absolute;
      z-index: 7;
      inset: 0;
      overflow: auto;
      padding: 24px;
      background: var(--page-bg);
    }
    .views-tablist {
      position: sticky;
      z-index: 1;
      top: 0;
      display: flex;
      gap: 8px;
      padding-bottom: 16px;
      background: var(--page-bg);
    }
    .views-tab {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--hairline);
      border-radius: 3px;
      background: var(--control-bg);
      color: var(--text);
    }
    .views-tab[aria-selected="true"] { border-color: var(--focus); }
    .views-tab:focus-visible,
    .network-relationship:focus-visible,
    .ado-stage-card:focus-visible,
    .ado-transition:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }
    .views-panel { max-width: 1120px; margin: 0 auto 32px; scroll-margin-top: 88px; }
    .network-container {
      min-width: 0;
      margin: 12px 0;
      padding: 16px;
      border: 1px solid var(--hairline);
      overflow-wrap: anywhere;
    }
    .network-resource-card {
      min-width: 0;
      margin: 12px 0;
      padding: 12px;
      border: 1px solid var(--hairline);
    }
    .network-resource-card svg { display: block; width: 32px; height: 32px; }
    .container-fields,
    .resource-fields { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 4px 12px; }
    .container-fields dd,
    .resource-fields dd { margin: 0; overflow-wrap: anywhere; }
    .network-relationships { display: grid; gap: 12px; }
    .network-diagram { position: relative; isolation: isolate; }
    .network-connectors-overlay {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      color: var(--network-direct);
      pointer-events: none;
    }
    .network-connectors-overlay > .network-relationship {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      overflow: visible;
      pointer-events: auto;
    }
    .network-hierarchy { position: relative; z-index: 1; }
    .network-connectors-overlay .network-relationship text { display: none; }
    .network-relationship { width: min(100%, 360px); max-width: 100%; color: var(--network-direct); opacity: .92; }
    .network-relationship.evidence-direct { color: var(--network-direct); opacity: .92; }
    .network-relationship.evidence-inferred { color: var(--network-inferred); opacity: .78; }
    .network-relationship.evidence-held { color: var(--network-held); opacity: .58; }
    .network-relationship path[data-connector-shape] { vector-effect: non-scaling-stroke; }
    .network-relationship text { fill: currentColor; font: 11px var(--font-family); }
    .network-relationship.evidence-held path[data-connector-shape] { opacity: .65; }
    .ado-pipeline {
      min-width: 0;
      margin: 16px 0 28px;
      overflow-wrap: anywhere;
    }
    .ado-stage-graph {
      display: grid;
      grid-auto-columns: minmax(170px, 1fr);
      grid-auto-rows: max-content;
      gap: 16px;
      align-items: start;
      margin: 16px 0 24px;
      overflow-x: auto;
      padding: 4px 4px 12px;
    }
    .ado-stage-card {
      grid-column-start: var(--ado-column);
      grid-row-start: var(--ado-lane);
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--hairline);
      border-top-width: 4px;
      background: var(--control-bg);
    }
    .ado-stage-card.stage-gate { border-top-style: double; }
    .ado-stage-card.stage-held,
    .ado-stage-card.status-held { border-style: dashed; }
    .ado-stage-card svg { display: block; width: 32px; height: 32px; }
    .ado-stage-card h4 { margin: 10px 0; }
    .ado-stage-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .ado-stage-badges span {
      padding: 3px 6px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }
    .ado-stage-fields {
      display: grid;
      grid-template-columns: minmax(64px, .8fr) minmax(0, 1.2fr);
      gap: 4px 10px;
      margin: 0 0 12px;
    }
    .ado-stage-fields dd { margin: 0; overflow-wrap: anywhere; }
    .ado-stage-card > ul { padding-left: 18px; }
    .ado-stage-evidence { margin-top: 12px; }
    .ado-stage-evidence summary { cursor: pointer; font-weight: 700; }
    .ado-stage-evidence ul { margin-bottom: 0; padding-left: 18px; }
    .ado-target-type { color: var(--muted); }
    .manual-state,
    .held-state {
      padding: 8px;
      border: 1px dashed currentColor;
      font-weight: 700;
    }
    .ado-transitions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .ado-transition {
      display: block;
      width: 100%;
      max-width: 100%;
      color: var(--text);
      border: 1px solid var(--hairline);
      background: var(--control-bg);
    }
    .ado-transition text { fill: currentColor; font: 11px var(--font-family); }
    .ado-transition.transition-dependency path[data-transition-shape],
    .ado-transition.transition-approval path[data-transition-shape],
    .ado-transition.transition-manual path[data-transition-shape] { stroke-dasharray: 10 5; }
    .ado-transition.transition-held path[data-transition-shape] {
      stroke-dasharray: 2 6;
      opacity: .65;
    }
    .ado-transition-evidence {
      color: var(--text);
      font: 10px/1.45 var(--font-family);
      overflow-wrap: anywhere;
    }
    .ado-transition-evidence ul { margin: 6px 0 0; padding-left: 18px; }
    body[data-views-sha256]:has(#runtime:not([hidden])) .views-shell {
      inset: auto 18px 18px auto;
      width: min(420px, calc(100% - 36px));
      max-height: min(70vh, 640px);
      border: 1px solid var(--hairline);
      border-radius: 3px;
      background: var(--control-bg);
    }
    body[data-views-sha256]:has(#runtime:not([hidden])) .views-tablist { background: var(--control-bg); }
    @media (max-width: 720px) {

      .legend button span:last-child { display: none; }
      .views-shell { padding: 16px; }
      .ado-stage-graph { display: flex; flex-direction: column; overflow-x: visible; }
      .ado-stage-card { width: 100%; }
      body[data-views-sha256]:has(#runtime:not([hidden])) .views-shell { inset: auto 8px 8px 8px; width: auto; max-height: 52vh; }
    }

    }

      ctx.beginPath();
      ctx.arc(payload.point.x, payload.point.y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = style.color;
      ctx.beginPath();
      ctx.arc(payload.point.x, payload.point.y, 2.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    },

    drawSelection(ctx, path, kind, mode) {
      ctx.save();
      ctx.strokeStyle = mode === "hover" ? "rgba(0,120,212,.58)" : "rgba(0,120,212,.94)";
      ctx.lineWidth = kind === "path" ? 7 : 2.5;

    function enhanceViewsTabs() {
      if (typeof VIEWS_SIDECAR === "undefined") return;
      const viewIds = ["runtime", "network", "ado"];
      const tabs = viewIds
        .map(view => document.getElementById(`tab-${view}`))
        .filter(Boolean);
      const panels = viewIds
        .map(view => document.getElementById(view))
        .filter(Boolean);
      const viewsShell = document.querySelector(".views-shell");
      const selectionDetails = document.querySelector("[data-testid=views-selection-details]");
      const selectedSemanticId = localStorage.getItem("jcode:selectedSemanticId") || "";
      if (tabs.length !== viewIds.length || panels.length !== viewIds.length) return;

      const validView = view => viewIds.includes(view) ? view : null;
      const hashView = () => validView(location.hash.replace(/^#/, ""));
      const selectedInitialView = hashView() || validView(VIEWS_SIDECAR.default_view) || "runtime";

      function setActiveView(activeView, options = {}) {
        const selectedView = validView(activeView) || "runtime";
        tabs.forEach(tab => {
          const view = tab.getAttribute("aria-controls");
          const active = view === selectedView;
          tab.setAttribute("aria-selected", String(active));
          tab.tabIndex = active ? 0 : -1;
        });
        panels.forEach(panel => {
          panel.hidden = panel.id !== selectedView;
        });
        if (selectedSemanticId) {
          document.querySelector(`[data-semantic-id="${CSS.escape(selectedSemanticId)}"]`)?.setAttribute("aria-current", "true");
        }
        viewsShell?.scrollTo({ top: 0, left: 0, behavior: "auto" });
        if (selectedView === "network") requestAnimationFrame(rerouteNetworkConnectors);
        if (!options.skipHistory && location.hash !== `#${selectedView}`) {
          history.replaceState(null, "", `#${selectedView}`);
        }
      }

      document.querySelectorAll("[data-selectable=true][data-semantic-id]").forEach(element => {
        element.addEventListener("click", () => {
          localStorage.setItem("jcode:selectedSemanticId", element.dataset.semanticId);
          element.setAttribute("aria-current", "true");
          if (selectionDetails) {
            selectionDetails.querySelector("[data-selection-empty]")?.setAttribute("hidden", "true");
            const content = selectionDetails.querySelector("[data-selection-content]");
            if (content) { content.hidden = false; content.textContent = element.textContent.trim(); }
          }
        });
      });

      function focusRelativeTab(currentTab, delta) {
        const index = tabs.indexOf(currentTab);
        const next = tabs[(index + delta + tabs.length) % tabs.length];
        next.focus();
      }

      tabs.forEach(tab => {
        tab.addEventListener("click", () => setActiveView(tab.getAttribute("aria-controls")));
        tab.addEventListener("keydown", event => {
          if (event.key === "ArrowLeft") {
            event.preventDefault();
            focusRelativeTab(tab, -1);
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            focusRelativeTab(tab, 1);
          } else if (event.key === "Home") {
            event.preventDefault();
            tabs[0].focus();
          } else if (event.key === "End") {
            event.preventDefault();
            tabs[tabs.length - 1].focus();
          } else if (event.key === "Enter" || event.key === " " || event.code === "Space") {
            event.preventDefault();
            setActiveView(tab.getAttribute("aria-controls"));
          }
        });
      });

      window.addEventListener("hashchange", () => {
        const view = hashView();
        if (view) setActiveView(view, { skipHistory: true });
      });
      setActiveView(VIEWS_SIDECAR.default_view ? selectedInitialView : selectedInitialView, { skipHistory: Boolean(hashView()) });
    }

    function rerouteNetworkConnectors() {
      const overlay = document.querySelector('[data-network-connectors]');
      if (!overlay) return;
      const overlayRect = overlay.getBoundingClientRect();
      const width = Math.max(1, Math.round(overlayRect.width));
      const height = Math.max(1, Math.round(overlayRect.height));
      const endpointGap = 8;
      const laneSpacing = 9;
      overlay.setAttribute("width", String(width));
      overlay.setAttribute("height", String(height));
      overlay.setAttribute("viewBox", `0 0 ${width} ${height}`);
      const center = rect => ({ x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 });
      const point = (x, y) => ({ x: Math.round(x - overlayRect.left), y: Math.round(y - overlayRect.top) });
      const manhattanDistance = (first, second) => Math.abs(first.x - second.x) + Math.abs(first.y - second.y);
      const resourceRects = [...document.querySelectorAll("#network .network-resource-card")].map(card => ({
        id: card.getAttribute("data-scene-node-id"),
        rect: card.getBoundingClientRect(),
      }));
      overlay.querySelectorAll('[data-link-id]').forEach(relationship => {
        const sourceId = relationship.getAttribute("data-source-node-id");
        const targetId = relationship.getAttribute("data-target-node-id");
        const source = document.querySelector(`[data-scene-node-id="${CSS.escape(sourceId || "")}"]`);
        const target = document.querySelector(`[data-scene-node-id="${CSS.escape(targetId || "")}"]`);
        const path = relationship.querySelector('[data-connector-shape="orthogonal"]');
        if (!source || !target || !path) return;
        relationship.setAttribute("width", String(width));
        relationship.setAttribute("height", String(height));
        relationship.setAttribute("viewBox", `0 0 ${width} ${height}`);
        const sourceRect = source.getBoundingClientRect();
        const targetRect = target.getBoundingClientRect();
        const sourceCenter = center(sourceRect);
        const targetCenter = center(targetRect);
        const horizontalForward = targetCenter.x >= sourceCenter.x;
        const verticalForward = targetCenter.y >= sourceCenter.y;
        const horizontal = {
          sourceEdge: horizontalForward ? "right" : "left",
          targetEdge: horizontalForward ? "left" : "right",
          start: point(horizontalForward ? sourceRect.right + endpointGap : sourceRect.left - endpointGap, sourceCenter.y),
          end: point(horizontalForward ? targetRect.left - endpointGap : targetRect.right + endpointGap, targetCenter.y),
        };
        const vertical = {
          sourceEdge: verticalForward ? "bottom" : "top",
          targetEdge: verticalForward ? "top" : "bottom",
          start: point(sourceCenter.x, verticalForward ? sourceRect.bottom + endpointGap : sourceRect.top - endpointGap),
          end: point(targetCenter.x, verticalForward ? targetRect.top - endpointGap : targetRect.bottom + endpointGap),
        };
        horizontal.score = manhattanDistance(horizontal.start, horizontal.end);
        vertical.score = manhattanDistance(vertical.start, vertical.end);
        const routeLane = Number.parseInt(relationship.getAttribute("data-route-lane") || "0", 10) || 0;
        const laneOffset = routeLane * laneSpacing;
        let d;
        if (vertical.score <= horizontal.score) {
          const start = { ...vertical.start, x: vertical.start.x + laneOffset };
          const end = { ...vertical.end, x: vertical.end.x + laneOffset };
          const midY = Math.round(start.y + (end.y - start.y) / 2);
          const pageX = sourceCenter.x + laneOffset;
          const pageTop = Math.min(sourceCenter.y, targetCenter.y);
          const pageBottom = Math.max(sourceCenter.y, targetCenter.y);
          const blocked = resourceRects.some(({ id, rect }) => id !== sourceId && id !== targetId
            && pageX > rect.left && pageX < rect.right && pageBottom > rect.top && pageTop < rect.bottom);
          if (blocked && resourceRects.length) {
            const leftGutter = Math.max(overlayRect.left + endpointGap, Math.min(...resourceRects.map(({ rect }) => rect.left)) - endpointGap);
            const rightGutter = Math.min(overlayRect.right - endpointGap, Math.max(...resourceRects.map(({ rect }) => rect.right)) + endpointGap);
            const useRightGutter = routeLane >= 0;
            const gutterX = useRightGutter ? rightGutter : leftGutter;
            const gutter = point(gutterX, 0).x;
            const midGutter = gutter + (useRightGutter ? -4 : 4);
            d = `M${start.x} ${start.y} H${gutter} V${midY} H${midGutter} V${end.y} H${end.x}`;
          } else {
            const midX = Math.round((start.x + end.x) / 2 + laneOffset);
            d = `M${start.x} ${start.y} V${midY} H${midX} V${end.y} H${end.x}`;
          }
          relationship.dataset.routeAxis = "vertical";
          relationship.dataset.routeSourceEdge = vertical.sourceEdge;
          relationship.dataset.routeTargetEdge = vertical.targetEdge;
          relationship.dataset.routeObstructed = String(blocked);
        } else {
          const start = { ...horizontal.start, y: horizontal.start.y + laneOffset };
          const end = { ...horizontal.end, y: horizontal.end.y + laneOffset };
          const midX = Math.round(start.x + (end.x - start.x) / 2);
          const midY = Math.round((start.y + end.y) / 2 + laneOffset);
          d = `M${start.x} ${start.y} H${midX} V${midY} H${end.x} V${end.y}`;
          relationship.dataset.routeAxis = "horizontal";
          relationship.dataset.routeSourceEdge = horizontal.sourceEdge;
          relationship.dataset.routeTargetEdge = horizontal.targetEdge;
        }
        relationship.dataset.routeEndpointGap = String(endpointGap);
        path.setAttribute("d", d);
      });
    }

    function applyDocumentTheme() {

    function project(x, y, z = 0) {
      return {
        x: state.originX + (x - y) * state.tileWidth / 2,
        y: state.originY + (x + y) * state.tileHeight / 2 - z * state.heightUnit,
      };
    }

    function polygonPath(points) {
      const path = new Path2D();
      points.forEach((point, index) => {
        if (index === 0) path.moveTo(point.x, point.y);
        else path.lineTo(point.x, point.y);
      });
      path.closePath();
      return path;
    }

    function polylinePath(points) {
      const path = new Path2D();
      points.forEach((point, index) => {
        if (index === 0) path.moveTo(point.x, point.y);
        else path.lineTo(point.x, point.y);
      });
      return path;
    }

    function cuboidFaces(node, mass) {
      const x = node.position.x + mass.ox;
      const y = node.position.y + mass.oy;
      const z = mass.z || 0;
      const floor = [
        project(x, y, z),
        project(x + mass.width, y, z),
        project(x + mass.width, y + mass.depth, z),
        project(x, y + mass.depth, z),
      ];
      const roof = [
        project(x, y, z + mass.height),
        project(x + mass.width, y, z + mass.height),
        project(x + mass.width, y + mass.depth, z + mass.height),
        project(x, y + mass.depth, z + mass.height),
      ];
      return {
        roof: polygonPath(roof),
        roofPoints: roof,
        left: polygonPath([roof[3], roof[2], floor[2], floor[3]]),
        right: polygonPath([roof[1], roof[2], floor[2], floor[1]]),
      };
    }

    function iconColor(node) {
      if (typeof THEME.iconColor === "function") return THEME.iconColor(node, state);
      return THEME.css?.text || "#212121";

    function iconDataUrl(svg, color) {
      const colored = svg.replaceAll("currentColor", color);
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(colored)}`;
    }

    async function preloadIcons() {
      const loads = SCENE.nodes
        .filter(node => node.icon && ICON_SVGS[node.icon])
        .map(node => new Promise(resolve => {
          const image = new Image();
          image.onload = () => {
            iconImages.set(node.id, image);
            resolve();
          };
          image.onerror = resolve;
          image.src = iconDataUrl(ICON_SVGS[node.icon], iconColor(node));
        }));
      await Promise.all(loads);
    }

    function iconWorldSizeFor(mass) {
      if (typeof THEME.iconWorldSize === "function") return THEME.iconWorldSize(mass, state);
      return Math.min(mass.width, mass.depth) * .64;
    }

    function drawNodeIcon(ctx, node, roofPoints, mass) {
      const image = iconImages.get(node.id);
      if (!image || !roofPoints || !mass) return false;
      const iconWorldSize = iconWorldSizeFor(mass);
      if (iconWorldSize <= 0) return false;
      const uFraction = iconWorldSize / mass.width;
      const vFraction = iconWorldSize / mass.depth;
      const uInset = (1 - uFraction) / 2;
      const vInset = (1 - vFraction) / 2;
      const u = {
        x: roofPoints[1].x - roofPoints[0].x,
        y: roofPoints[1].y - roofPoints[0].y,
      };
      const v = {
        x: roofPoints[3].x - roofPoints[0].x,
        y: roofPoints[3].y - roofPoints[0].y,
      };
      const origin = {
        x: roofPoints[0].x + u.x * uInset + v.x * vInset,
        y: roofPoints[0].y + u.y * uInset + v.y * vInset,
      };
      ctx.save();
      ctx.globalAlpha = node.status === "held" ? .58 : .92;
      ctx.transform(
        u.x * uFraction / 24,
        u.y * uFraction / 24,
        v.x * vFraction / 24,
        v.y * vFraction / 24,
        origin.x,
        origin.y,
      );
      ctx.drawImage(image, 0, 0, 24, 24);
      ctx.restore();
      return true;
    }

    function cubeMassFor(node) {
      const width = node.footprint.width;
      const depth = node.footprint.depth;
      const cubeEdge = SCENE.canvas.cube_size;
      const projectedEdge = Math.hypot(state.tileWidth / 2, state.tileHeight / 2);
      const projectedHeight = cubeEdge * projectedEdge / state.heightUnit;
      return {
        ox: (width - cubeEdge) / 2,
        oy: (depth - cubeEdge) / 2,
        width: cubeEdge,
        depth: cubeEdge,
        height: projectedHeight,
        z: 0,
        cubeEdge,
        form: "cube",
      };
    }

    function massesFor(node) {
      return [cubeMassFor(node)];
    }

    function areaRect(area) {
      const members = area.member_ids.map(id => SCENE.nodes.find(node => node.id === id));
      const padding = area.padding;
      const left = Math.min(...members.map(node => node.position.x)) - padding;
      const back = Math.min(...members.map(node => node.position.y)) - padding;
      const right = Math.max(...members.map(node => node.position.x + node.footprint.width)) + padding;
      const front = Math.max(...members.map(node => node.position.y + node.footprint.depth)) + padding;
      return { x: left, y: back, width: right - left, depth: front - back };
    }

    function trafficLayerRect(layer) {
      const members = layer.member_ids.map(id => SCENE.nodes.find(node => node.id === id));
      const padding = layer.padding;
      const left = Math.min(...members.map(node => node.position.x)) - padding;
      const back = Math.min(...members.map(node => node.position.y)) - padding;
      const right = Math.max(...members.map(node => node.position.x + node.footprint.width)) + padding;
      const front = Math.max(...members.map(node => node.position.y + node.footprint.depth)) + padding;
      return { x: left, y: back, width: right - left, depth: front - back };
    }

    function depthKey(node) {
      const farX = node.position.x + node.footprint.width;
      const farY = node.position.y + node.footprint.depth;
      return farX + farY;
    }

    function routePoints(item) {
      return item.route.map(point => project(point.x, point.y, 0));
    }

    function pointOnPolyline(points, progress) {
      const lengths = [];
      let total = 0;
      for (let index = 1; index < points.length; index += 1) {
        const dx = points[index].x - points[index - 1].x;
        const dy = points[index].y - points[index - 1].y;
        const length = Math.hypot(dx, dy);
        lengths.push(length);
        total += length;
      }
      let remaining = Math.max(0, Math.min(1, progress)) * total;
      for (let index = 0; index < lengths.length; index += 1) {
        const length = lengths[index];
        if (remaining <= length || index === lengths.length - 1) {
          const ratio = length === 0 ? 0 : remaining / length;
          return {
            x: points[index].x + (points[index + 1].x - points[index].x) * ratio,
            y: points[index].y + (points[index + 1].y - points[index].y) * ratio,
          };
        }
        remaining -= length;
      }
      return points[points.length - 1];
    }

    function fitView() {
      const sum = SCENE.canvas.grid_width + SCENE.canvas.grid_depth;
      const horizontal = state.width * .82 * 2 / sum;
      const vertical = state.height * .64 * 4 / sum;
      state.tileWidth = Math.max(34, Math.min(112, horizontal, vertical));
      state.tileHeight = state.tileWidth / 2;
      state.heightUnit = state.tileHeight * .68;
      state.originX = state.width * .52;
      state.originY = Math.max(120, state.height * .2);
    }

    function prepareCanvases() {
      const rect = stage.getBoundingClientRect();
      state.width = Math.max(320, Math.round(rect.width));
      state.height = Math.max(420, Math.round(rect.height));
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      Object.entries(canvases).forEach(([name, canvas]) => {
        canvas.width = Math.round(state.width * state.dpr);
        canvas.height = Math.round(state.height * state.dpr);
        canvas.style.width = `${state.width}px`;
        canvas.style.height = `${state.height}px`;
        contexts[name].setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      });
      fitView();
    }

    function clearTransparent(ctx) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      ctx.restore();
    }

    function drawTerrain() {
      const ctx = contexts.terrain;
      ctx.save();
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      THEME.drawBackground(ctx, state, SCENE);
      const ground = polygonPath([
        project(0, 0),
        project(SCENE.canvas.grid_width, 0),
        project(SCENE.canvas.grid_width, SCENE.canvas.grid_depth),
        project(0, SCENE.canvas.grid_depth),
      ]);
      THEME.drawGround(ctx, ground, state, SCENE);
      for (let x = 0; x <= SCENE.canvas.grid_width; x += 1) {
        const path = polylinePath([project(x, 0), project(x, SCENE.canvas.grid_depth)]);
        THEME.drawGridLine(ctx, path, x === 0 || x === SCENE.canvas.grid_width, state);
      }
      for (let y = 0; y <= SCENE.canvas.grid_depth; y += 1) {
        const path = polylinePath([project(0, y), project(SCENE.canvas.grid_width, y)]);
        THEME.drawGridLine(ctx, path, y === 0 || y === SCENE.canvas.grid_depth, state);
      }
      state.trafficLayerHits = [];
      state.trafficLayerGeometry = [];
      const trafficLayers = SCENE.traffic?.layers || [];
      // Traffic order is conveyed by the dependency chain. Do not draw a
      // second incoming arrow from APIM to the external-services layer.
      const direction = "bottom-left-to-top-right";
      // direction: "bottom-left-to-top-right"
      // THEME.drawTrafficDirection(points, traffic, state)
      // THEME.drawTrafficDirection remains an adapter capability for callers
      // that explicitly opt into an aggregate direction marker.
      trafficLayers.forEach((layer, index) => {
        const rect = trafficLayerRect(layer);
        const points = [
          project(rect.x, rect.y),
          project(rect.x + rect.width, rect.y),
          project(rect.x + rect.width, rect.y + rect.depth),
          project(rect.x, rect.y + rect.depth),
        ];
        const path = polygonPath(points);
        const center = project(rect.x + rect.width / 2, rect.y + rect.depth / 2, 0);
        THEME.drawTrafficLayer(ctx, path, layer, index, center, state);
        state.trafficLayerHits.push({ item: layer, path, points });
        state.trafficLayerGeometry.push({
          id: layer.id,
          kind: layer.kind,
          order: index + 1,
          memberIds: [...layer.member_ids],
          bounds: { ...rect },
          center: { x: center.x, y: center.y },
        });
      });
      state.areaHits = [];
      state.areaGeometry = [];
      SCENE.areas.forEach(area => {
        const rect = areaRect(area);
        const points = [
          project(rect.x, rect.y),
          project(rect.x + rect.width, rect.y),
          project(rect.x + rect.width, rect.y + rect.depth),
          project(rect.x, rect.y + rect.depth),
        ];
        const path = polygonPath(points);
        const labelPoint = project(rect.x + rect.width / 2, rect.y, 0);
        THEME.drawArea(ctx, path, area, labelPoint, state);
        state.areaHits.push({ item: area, path, points });
        state.areaGeometry.push({
          id: area.id,
          kind: area.kind,
          status: area.status,
          memberIds: [...area.member_ids],
          bounds: { ...rect },
        });
      });
      const nodesByZone = new Map();
      SCENE.nodes.forEach(node => {
        if (!nodesByZone.has(node.zone)) nodesByZone.set(node.zone, []);
        nodesByZone.get(node.zone).push(node);
      });
      SCENE.zones.forEach(zone => {
        const nodes = nodesByZone.get(zone.id) || [];
        if (!nodes.length) return;
        const average = nodes.reduce((sum, node) => ({
          x: sum.x + node.position.x + node.footprint.width / 2,
          y: sum.y + node.position.y + node.footprint.depth / 2,
        }), { x: 0, y: 0 });
        const point = project(average.x / nodes.length, average.y / nodes.length, 0);
        THEME.drawZone(ctx, zone, point, state);
      });
      ctx.restore();
    }

    function drawArchitecture() {
      const ctx = contexts.architecture;
      clearTransparent(ctx);
      ctx.save();
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      state.pathHits = [];
      state.nodeHits = [];
      state.routeGeometry.clear();
      state.renderedIcons = [];
      state.nodeGeometry = [];
      // Label plate geometry is rebuilt on every resize so responsive layouts use
      // the same deterministic overlap avoidance as the initial render.
      state.labelPlates = [];

      SCENE.paths.forEach(item => {
        const points = routePoints(item);
        const path = polylinePath(points);
        state.routeGeometry.set(item.id, points);
        THEME.drawRoute(ctx, path, item, state);
        THEME.drawArrow(ctx, points, item, state);
        THEME.drawPathLabel(ctx, points, item, state);
        state.pathHits.push({ item, path, points });
      });

      [...SCENE.nodes].sort((a, b) => depthKey(a) - depthKey(b)).forEach(node => {
        const hit = new Path2D();
        let iconRoof = null;
        let iconMass = null;
        let iconHeight = -Infinity;
        const nodeMasses = massesFor(node);
        nodeMasses
          .sort((a, b) => (a.ox + a.oy + (a.z || 0)) - (b.ox + b.oy + (b.z || 0)))
          .forEach((mass, massIndex) => {
            const faces = cuboidFaces(node, mass);
            const massTop = (mass.z || 0) + mass.height;
            if (massTop > iconHeight) {
              iconHeight = massTop;
              iconRoof = faces.roofPoints;
              iconMass = mass;
            }
            ["left", "right", "roof"].forEach(side => {
              THEME.drawFace(ctx, faces[side], side, node, massIndex, state);
              hit.addPath(faces[side]);
            });
          });
        const cube = nodeMasses[0];
        state.nodeGeometry.push({
          id: node.id,
          form: cube.form,
          massCount: nodeMasses.length,
          width: cube.width,
          depth: cube.depth,
          projectedGroundEdge: cube.cubeEdge * Math.hypot(state.tileWidth / 2, state.tileHeight / 2),
          projectedVerticalEdge: cube.height * state.heightUnit,
          cubeEdge: cube.cubeEdge,
        });
        if (drawNodeIcon(ctx, node, iconRoof, iconMass)) state.renderedIcons.push(node.id);
        const labelPoint = project(
          node.position.x + node.footprint.width / 2,
          node.position.y + node.footprint.depth / 2,
          iconHeight + .4,
        );
        THEME.drawNodeLabel(ctx, node, labelPoint, state);
        state.nodeHits.push({ item: node, path: hit });
      });
      ctx.restore();
    }

    function targetKey(target) {
      return target ? `${target.kind}:${target.item.id}` : "";
    }

    function targetButton(target) {
      return target ? buttonByTarget.get(targetKey(target)) : null;
    }

    function targetDescription(target) {
      if (!target) return "";
      const item = target.item;
      const evidenceItems = Array.isArray(item.evidence) ? item.evidence : [];
      const evidence = evidenceItems.map(entry => `${entry.path}:${entry.lines}`).join("; ");
      const claim = evidenceItems.map(entry => entry.claim).filter(Boolean).join("; ");
      const relationship = target.kind === "path"
        ? `${item.from} → ${item.to} · ${item.kind}`
        : target.kind === "traffic-layer"
          ? `traffic layer ${SCENE.traffic.layers.findIndex(layer => layer.id === item.id) + 1} · ${item.kind}`
        : target.kind === "area"
          ? `${item.kind} area · ${item.status}`
          : `${item.role} · ${item.status}`;
      return [relationship, item.description || item.label, evidence, claim];
    }

    function showTooltip(target, point = null) {
      if (!target) {
        tooltip.dataset.visible = "false";
        tooltip.replaceChildren();
        return;
      }
      const [relationship, description, evidence, claim] = targetDescription(target);
      const title = document.createElement("strong");
      title.textContent = target.item.label;
      const relationshipLine = document.createElement("span");
      relationshipLine.textContent = relationship || "";
      const descriptionLine = document.createElement("span");
      descriptionLine.textContent = description || "";
      const evidenceLine = document.createElement("span");
      evidenceLine.textContent = evidence || "";
      const claimLine = document.createElement("span");
      claimLine.textContent = claim || "";
      tooltip.replaceChildren(title, relationshipLine, descriptionLine, evidenceLine, claimLine);
      const x = point ? point.clientX + 16 : Math.min(state.width - 380, 28);
      const y = point ? point.clientY + 16 : 110;
      tooltip.style.left = `${Math.max(12, Math.min(window.innerWidth - 380, x))}px`;
      tooltip.style.top = `${Math.max(12, Math.min(window.innerHeight - 150, y))}px`;
      tooltip.dataset.visible = "true";
    }

    function sameTarget(a, b) {
      return Boolean(a && b && a.kind === b.kind && a.item.id === b.item.id);
    }

    function drawFocusTarget(ctx, target, mode) {
      if (!target) return;
      const records = target.kind === "node"
        ? state.nodeHits
        : target.kind === "traffic-layer"
          ? state.trafficLayerHits
        : target.kind === "area"
          ? state.areaHits
          : state.pathHits;
      const record = records.find(candidate => candidate.item.id === target.item.id);
      if (!record) return;
      THEME.drawSelection(ctx, record.path, target.kind, mode, target.item, state);
      const button = targetButton(target);
      if (button && document.activeElement === button) {
        ctx.drawFocusIfNeeded(record.path, button);
      }
    }

    function payloadState(timestamp) {
      const flow = SCENE.flows.find(item => item.id === state.activeFlowId) || SCENE.flows[0];
      const steps = (flow?.steps || []).filter(step => step.evidence_level !== "held");
      if (!flow || !steps.length) return null;
      const duration = Math.max(800, THEME.motion?.stepDuration || 2400);
      if (state.startedAt === null) state.startedAt = timestamp;
      const elapsed = Math.max(0, timestamp - state.startedAt);
      const stepIndex = state.paused || reducedMotion.matches
        ? Math.min(steps.length - 1, Math.floor(elapsed / duration) % steps.length)
        : Math.floor(elapsed / duration) % steps.length;
      const progress = state.paused || reducedMotion.matches
        ? 1
        : (elapsed % duration) / duration;
      const step = steps[stepIndex];
      const points = state.routeGeometry.get(step.path);
      if (!points) return null;
      const payload = SCENE.payloads.find(item => item.id === step.payload);
      return { flow, step, payload, stepIndex, progress, point: pointOnPolyline(points, progress) };
    }

    function drawMotion(timestamp = state.lastTimestamp || performance.now()) {
      state.lastTimestamp = timestamp;
      const ctx = contexts.motion;
      clearTransparent(ctx);
      ctx.save();
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      drawFocusTarget(ctx, state.hovered, "hover");
      if (!sameTarget(state.selected, state.hovered)) drawFocusTarget(ctx, state.selected, "selected");
      const payload = payloadState(timestamp);
      if (payload) THEME.drawPayload(ctx, payload, state);
      ctx.restore();
      state.frameCount += 1;
    }

    function stopAnimation() {
      if (state.raf !== null) cancelAnimationFrame(state.raf);
      state.raf = null;
    }

    function animationFrame(timestamp) {
      state.raf = null;
      drawMotion(timestamp);
      if (SCENE.flows.length > 0 && !state.paused && !reducedMotion.matches && !document.hidden) {
        state.raf = requestAnimationFrame(animationFrame);
      }
    }

    function startAnimation() {
      stopAnimation();
      if (SCENE.flows.length > 0 && !state.paused && !reducedMotion.matches && !document.hidden) {
        state.raf = requestAnimationFrame(animationFrame);
      } else {
        drawMotion();
      }
    }

    function updatePauseControl() {
      const effectivelyPaused = state.paused || reducedMotion.matches;
      pauseButton.textContent = effectivelyPaused ? "Play" : "Pause";
      pauseButton.setAttribute("aria-pressed", String(effectivelyPaused));
      pauseButton.disabled = reducedMotion.matches;
      pauseButton.title = reducedMotion.matches
        ? "Motion is disabled by your reduced-motion preference"
        : effectivelyPaused ? "Resume payload motion" : "Pause payload motion";
    }

    function canvasPoint(event) {
      const rect = canvases.motion.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * state.width / rect.width,
        y: (event.clientY - rect.top) * state.height / rect.height,
      };
    }

    function hitTest(point) {
      for (let index = state.nodeHits.length - 1; index >= 0; index -= 1) {
        const candidate = state.nodeHits[index];
        if (hitContext.isPointInPath(candidate.path, point.x, point.y)) {
          return { kind: "node", item: candidate.item };
        }
      }
      for (let index = state.pathHits.length - 1; index >= 0; index -= 1) {
        const candidate = state.pathHits[index];
        const style = THEME.pathStyle(candidate.item.kind);
        hitContext.lineWidth = Math.max(14, (style.width || 2) + 10);
        hitContext.setLineDash(style.dash || []);
        if (hitContext.isPointInStroke(candidate.path, point.x, point.y)) {
          return { kind: "path", item: candidate.item };
        }
      }
      for (let index = state.areaHits.length - 1; index >= 0; index -= 1) {
        const candidate = state.areaHits[index];
        if (hitContext.isPointInPath(candidate.path, point.x, point.y)) {
          return { kind: "area", item: candidate.item };
        }
      }
      for (let index = state.trafficLayerHits.length - 1; index >= 0; index -= 1) {
        const candidate = state.trafficLayerHits[index];
        if (hitContext.isPointInPath(candidate.path, point.x, point.y)) {
          return { kind: "traffic-layer", item: candidate.item };
        }
      }
      return null;
    }

    function selectTarget(target, options = {}) {
      state.selected = target;
      if (target && options.focus) targetButton(target)?.focus();
      showTooltip(target, options.pointer || null);
      drawMotion();
    }

    function buildLegend() {
      const legend = document.querySelector(".legend");
      const kinds = [...new Set(SCENE.paths.map(path => path.kind))];
      kinds.forEach(kind => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.pathKind = kind;
        button.innerHTML = `<canvas class="legend-swatch" width="48" height="16" aria-hidden="true"></canvas><span>${kind}</span>`;
        const sample = button.querySelector("canvas");
        const sampleContext = sample.getContext("2d");
        const style = THEME.pathStyle(kind);
        sampleContext.strokeStyle = style.color;
        sampleContext.lineWidth = Math.max(1, style.width);
        sampleContext.setLineDash(style.dash || []);
        sampleContext.beginPath();
        sampleContext.moveTo(2, 8);
        sampleContext.lineTo(44, 8);
        sampleContext.stroke();
        button.addEventListener("focus", () => {
          const match = state.pathHits.find(record => record.item.kind === kind);
          if (match) selectTarget({ kind: "path", item: match.item });
        });
        button.addEventListener("click", () => {
          const match = state.pathHits.find(record => record.item.kind === kind);
          if (match) selectTarget({ kind: "path", item: match.item }, { focus: true });
        });
        legend.append(button);
      });
    }

    function buildFlowControl() {
      pauseButton.hidden = SCENE.flows.length === 0;
      flowControl.hidden = SCENE.flows.length < 2;
      SCENE.flows.forEach(flow => {
        const option = document.createElement("option");
        option.value = flow.id;
        option.textContent = flow.label;
        option.selected = flow.id === state.activeFlowId;
        flowSelect.append(option);
      });
    }

    function exportPng() {
      const output = document.createElement("canvas");
      output.width = canvases.terrain.width;
      output.height = canvases.terrain.height;
      const ctx = output.getContext("2d", { alpha: false });
      ctx.drawImage(canvases.terrain, 0, 0);
      ctx.drawImage(canvases.architecture, 0, 0);
      ctx.drawImage(canvases.motion, 0, 0);
      output.toBlob(blob => {
        if (!blob) return;
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = `${SCENE.repository.name}-isometric-map.png`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, "image/png");
    }

    function debugSnapshot() {
      return {
        theme: THEME.name,
        sceneHash: document.body.dataset.sceneSha256,
        trafficLayerCount: state.trafficLayerHits.length,
        areaCount: state.areaHits.length,
        nodeCount: state.nodeHits.length,
        pathCount: state.pathHits.length,
        fallbackTargetCount: fallbackButtons.length,
        layerCount: Object.keys(canvases).length,
        reducedMotion: reducedMotion.matches,
        paused: state.paused,
        rafActive: state.raf !== null,
        frameCount: state.frameCount,
        iconCount: Object.keys(ICON_SVGS).length,
        loadedIconCount: iconImages.size,
        renderedIcons: [...state.renderedIcons],
        trafficDirection: SCENE.traffic?.direction || null,
        trafficLayerGeometry: state.trafficLayerGeometry.map(item => ({
          ...item,
          memberIds: [...item.memberIds],
          bounds: { ...item.bounds },
          center: { ...item.center },
        })),
        areaGeometry: state.areaGeometry.map(item => ({
          ...item,
          memberIds: [...item.memberIds],
          bounds: { ...item.bounds },
        })),
        nodeGeometry: state.nodeGeometry.map(item => ({ ...item })),
        pathEvidence: PATH_EVIDENCE.map(path => ({ ...path })),
        selected: targetKey(state.selected) || null,
        hovered: targetKey(state.hovered) || null,
        activeFlow: state.activeFlowId,
        canvasSizes: Object.fromEntries(Object.entries(canvases).map(([name, canvas]) => [name, {
          cssWidth: state.width,
          cssHeight: state.height,
          pixelWidth: canvas.width,
          pixelHeight: canvas.height,
        }])),
      };
    }

    Object.defineProperty(window, "__ISO_MAP_DEBUG__", {
      configurable: true,
      get: debugSnapshot,
    });

    function resizeAndRender() {
      prepareCanvases();
      // drawArchitecture recomputes label geometry and collision avoidance after
      // every responsive resize, before the motion layer is painted.
      drawTerrain();
      drawArchitecture();
      drawMotion();
      rerouteNetworkConnectors();
      stage.dataset.rendered = "true";
      startAnimation();
    }

    canvases.motion.addEventListener("pointermove", event => {
      const target = hitTest(canvasPoint(event));
      if (!sameTarget(target, state.hovered)) {
        state.hovered = target;
        canvases.motion.style.cursor = target ? "pointer" : "default";
        showTooltip(target, target ? event : null);
        drawMotion();
      } else if (target) {
        showTooltip(target, event);
      }
    });
    canvases.motion.addEventListener("pointerleave", () => {
      state.hovered = null;
      showTooltip(state.selected);
      drawMotion();
    });
    canvases.motion.addEventListener("click", event => {
      const target = hitTest(canvasPoint(event));
      selectTarget(target, { focus: Boolean(target), pointer: target ? event : null });
    });

    fallbackButtons.forEach(button => {
      const kind = button.dataset.targetKind;
      const items = kind === "node"
        ? SCENE.nodes
        : kind === "area"
          ? SCENE.areas
          : kind === "traffic-layer"
            ? SCENE.traffic.layers
            : SCENE.paths;
      const item = items
        .find(candidate => candidate.id === button.dataset.targetId);
      const target = { kind, item };
      button.addEventListener("focus", () => selectTarget(target));
      button.addEventListener("click", () => selectTarget(target));
      button.addEventListener("blur", () => drawMotion());
    });

    pauseButton.addEventListener("click", () => {
      state.paused = !state.paused;
      if (!state.paused) state.startedAt = performance.now() - (state.lastTimestamp - (state.startedAt || state.lastTimestamp));
      updatePauseControl();
      startAnimation();
    });
    flowSelect.addEventListener("change", () => {
      state.activeFlowId = flowSelect.value;
      state.startedAt = null;
      state.lastTimestamp = 0;
      startAnimation();
    });
    exportButton.addEventListener("click", exportPng);
    reducedMotion.addEventListener("change", () => {
      state.paused = reducedMotion.matches || state.paused;
      updatePauseControl();
      startAnimation();
    });
    document.addEventListener("visibilitychange", startAnimation);

    const resizeObserver = new ResizeObserver(() => {
      if (state.resizeRaf !== null) cancelAnimationFrame(state.resizeRaf);
      state.resizeRaf = requestAnimationFrame(() => {
        state.resizeRaf = null;
        resizeAndRender();
      });
    });

    async function initialize() {
      applyDocumentTheme();
      buildFlowControl();
      buildLegend();
      updatePauseControl();
      await preloadIcons();
      resizeObserver.observe(stage);
      resizeAndRender();
    }

    initialize();
  })();
  </script>
</body>
</html>
